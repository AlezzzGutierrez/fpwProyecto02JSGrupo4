<!--
    Le indicamos al navegador que este documento
    utiliza la versión HTML5.
-->
<!DOCTYPE html>

<html lang="es">


<!--
    <head> contiene información de configuración
    de la página que no se muestra directamente
    dentro del contenido principal.
-->
<head>

    <meta charset="UTF-8">


    <!--
        Permite que la página se adapte al ancho
        de la pantalla del dispositivo.

        width=device-width:
        Utiliza el ancho del dispositivo.

        initial-scale=1.0:
        Establece el zoom inicial en 100%.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <!--
        El título que aparecerá
        en la pestaña del navegador.
    -->
    <title>Ejercicio 03</title>


<!--
    Cerramos la etiqueta <head>.
-->
</head>


<!--
    <body> contiene el contenido visible
    de la página web.
-->
<body>


    <!--
        El programa utilizará:
        - prompt() para pedir datos.
        - console.log() para mostrar resultados.
    -->


    <!--
        Conectamos el HTML con nuestro archivo JavaScript.

        src="../js/ejercicio03.js":

        ../ significa subir una carpeta.

        Como el HTML está dentro de "html",
        subimos a la carpeta principal del proyecto
        y entramos en "js".

        type="module":

        Indica que el archivo JavaScript utiliza módulos.

        Esto nos permite utilizar import y export.
    -->
    <script type="module" src="../js/ejercicio03.js"></script>


<!--
    Cerramos el cuerpo de la página.
-->
</body>


<!--
    Cerramos el documento HTML.
-->
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Rendimiento del Estudiante</title>
</head>
<body>
  <h2>Calcular Rendimiento del Estudiante</h2>

  <form id="formulario">
    <label>Total de preguntas:</label>
    <input type="number" id="totalPreguntas" required><br><br>

    <label>Respuestas correctas:</label>
    <input type="number" id="respuestasCorrectas" required><br><br>

    <button type="submit">Calcular</button>
  </form>

  <p id="resultado"></p>

  <script type="module" src="../js/index.js"></script>
</body>
</html>
